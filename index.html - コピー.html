<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>キャラデザ要素ガチャ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  background: #f4f1ed;
  color: #333;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Yu Gothic",
    "Meiryo",
    sans-serif;
}

.container {
  max-width: 1100px;
  margin: auto;
  background: white;
  padding: 16px;
  border-radius: 16px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
  margin: 0 0 4px;
  font-size: 26px;
}

.description {
  text-align: center;
  color: #777;
  font-size: 13px;
  margin-bottom: 10px;
}

.main-buttons {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  margin-bottom: 8px;
}

button {
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: 0.82;
}

.main-button {
  min-height: 38px;
  padding: 7px 5px;
  font-size: 12px;
  background: #333;
  color: white;
}

.secondary {
  background: #666;
}

.light {
  background: #e9e9e9;
  color: #333;
}

.status-message {
  min-height: 18px;
  text-align: center;
  font-size: 12px;
  color: #555;
  margin-bottom: 5px;
}

#results {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px;
}

.result {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 9px 10px;
  min-width: 0;
}

.result-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
}

.label {
  font-size: 12px;
  font-weight: bold;
  color: #777;
  white-space: nowrap;
}

.controls {
  display: flex;
  gap: 3px;
  flex-wrap: nowrap;
}

.small-button {
  padding: 4px 6px;
  background: #eee;
  color: #333;
  font-size: 11px;
  line-height: 1.1;
}

.lock-button.locked {
  background: #333;
  color: white;
}

.value {
  margin-top: 5px;
  font-size: 16px;
  line-height: 1.3;
  word-break: break-word;
  min-height: 21px;
}

.value.removed {
  color: #aaa;
  font-style: italic;
}

.palette {
  display: flex;
  gap: 5px;
  margin-top: 6px;
}

.color {
  flex: 1;
  min-height: 42px;
  border-radius: 7px;
  display: flex;
  align-items: end;
  justify-content: center;
  padding: 4px;
  color: white;
  text-shadow: 0 1px 3px black;
  font-size: 10px;
  text-align: center;
}

.history-toggle {
  margin-top: 9px;
  width: 100%;
  min-height: 34px;
  background: #eee;
  color: #333;
  font-size: 12px;
}

.history-section {
  display: none;
  margin-top: 8px;
  border-top: 1px solid #ddd;
  padding-top: 8px;
}

.history-section.open {
  display: block;
}

.history-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.history-title h2 {
  margin: 0;
  font-size: 17px;
}

.history-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px;
}

.history-item {
  padding: 9px;
  background: #f5f5f5;
  border-radius: 9px;
  border: 1px solid #ddd;
}

.history-time {
  font-size: 10px;
  color: #888;
  margin-bottom: 4px;
}

.history-summary {
  font-size: 12px;
  line-height: 1.4;
  margin-bottom: 5px;
}

.history-controls {
  display: flex;
  gap: 4px;
}

.empty-history {
  color: #999;
  text-align: center;
  padding: 12px;
  font-size: 12px;
  grid-column: 1 / -1;
}

/* スマホ */
@media (max-width: 700px) {
  body {
    padding: 5px;
  }

  .container {
    padding: 8px;
    border-radius: 10px;
  }

  h1 {
    font-size: 20px;
    margin-bottom: 2px;
  }

  .description {
    font-size: 11px;
    margin-bottom: 6px;
  }

  .main-buttons {
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    margin-bottom: 5px;
  }

  .main-button {
    min-height: 33px;
    font-size: 10px;
    padding: 5px 2px;
  }

  .status-message {
    min-height: 15px;
    font-size: 10px;
    margin-bottom: 3px;
  }

  #results {
    grid-template-columns: 1fr;
    gap: 4px;
  }

  .result {
    padding: 6px 7px;
    border-radius: 8px;
  }

  .label {
    font-size: 11px;
  }

  .small-button {
    font-size: 10px;
    padding: 3px 5px;
  }

  .value {
    margin-top: 3px;
    font-size: 14px;
    min-height: 18px;
  }

  .palette {
    gap: 4px;
    margin-top: 4px;
  }

  .color {
    min-height: 34px;
    font-size: 9px;
  }

  .history-toggle {
    margin-top: 5px;
    min-height: 30px;
    font-size: 11px;
  }

  .history-list {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

const locks = {};
const removed = {};
const currentResults = {};

function random(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function createResults() {
  const resultArea = document.getElementById("results");

  for (const key in items) {
    locks[key] = false;
    removed[key] = false;

    const result = document.createElement("div");
    result.className = "result";

    result.innerHTML = `
      <div class="result-header">
        <div class="label">${items[key].label}</div>

        <div class="controls">
          <button class="small-button" onclick="reroll('${key}')">↻</button>
          <button class="small-button" onclick="editItem('${key}')">✏️</button>
          <button class="small-button" onclick="removeItem('${key}')">✕</button>
          <button
            id="lock-${key}"
            class="small-button lock-button"
            onclick="toggleLock('${key}')"
          >🔓</button>
        </div>
      </div>

      <div class="value" id="value-${key}">？？？</div>

      ${
        key === "palette"
        ? `
        <div class="palette" id="palette-box">
          <div class="color" id="mainColor"></div>
          <div class="color" id="subColor"></div>
          <div class="color" id="accentColor"></div>
        </div>`
        : ""
      }
    `;

    resultArea.appendChild(result);
  }
}

function generateItem(key) {
  removed[key] = false;

  let result = random(items[key].values);

  if (key === "race" && result === "獣人") {
    result = "獣人（" + random(animals) + "）";
  }

  currentResults[key] = result;
  displayItem(key);
}

function displayItem(key) {
  const valueElement = document.getElementById("value-" + key);

  if (removed[key]) {
    valueElement.textContent = "（使用しない）";
    valueElement.classList.add("removed");

    if (key === "palette") {
      document.getElementById("palette-box").style.display = "none";
    }

    return;
  }

  valueElement.classList.remove("removed");

  if (key === "palette") {
    document.getElementById("palette-box").style.display = "flex";

    const palette = currentResults[key];

    valueElement.textContent = palette[0];

    setColor("mainColor", palette[1], "MAIN");
    setColor("subColor", palette[2], "SUB");
    setColor("accentColor", palette[3], "ACCENT");
  } else {
    valueElement.textContent = currentResults[key];
  }
}

function gachaAll() {
  for (const key in items) {
    if (!locks[key]) {
      generateItem(key);
    }
  }

  showMessage("🎲 引き直しました");
}

function reroll(key) {
  generateItem(key);
  showMessage("↻ " + items[key].label + "を引き直しました");
}

function editItem(key) {
  if (key === "palette") {
    editPalette();
    return;
  }

  const oldValue =
    removed[key]
      ? ""
      : currentResults[key];

  const input = prompt(
    items[key].label + "を入力してください。",
    oldValue || ""
  );

  if (input === null) return;

  const trimmed = input.trim();

  if (trimmed === "") return;

  currentResults[key] = trimmed;
  removed[key] = false;
  locks[key] = true;

  updateLockButton(key);
  displayItem(key);

  showMessage("✏️ " + items[key].label + "を確定しました");
}

function editPalette() {
  let old = currentResults.palette;

  if (!Array.isArray(old)) {
    old = ["", "#000000", "#FFFFFF", "#888888"];
  }

  const name = prompt("パレット名", old[0]);
  if (name === null) return;

  const main = prompt("メインカラー", old[1]);
  if (main === null) return;

  const sub = prompt("サブカラー", old[2]);
  if (sub === null) return;

  const accent = prompt("アクセントカラー", old[3]);
  if (accent === null) return;

  currentResults.palette = [
    name.trim() || "オリジナル",
    main.trim(),
    sub.trim(),
    accent.trim()
  ];

  removed.palette = false;
  locks.palette = true;

  updateLockButton("palette");
  displayItem("palette");

  showMessage("🎨 パレットを確定しました");
}

function removeItem(key) {
  removed[key] = true;
  locks[key] = true;

  updateLockButton(key);
  displayItem(key);

  showMessage("✕ " + items[key].label + "を非表示にしました");
}

function restoreRemoved() {
  let count = 0;

  for (const key in items) {
    if (removed[key]) {
      removed[key] = false;
      locks[key] = false;
      generateItem(key);
      updateLockButton(key);
      count++;
    }
  }

  showMessage(
    count === 0
      ? "削除項目はありません"
      : "♻️ 削除項目を復活させました"
  );
}

function toggleLock(key) {
  locks[key] = !locks[key];
  updateLockButton(key);
}

function updateLockButton(key) {
  const button = document.getElementById("lock-" + key);

  if (locks[key]) {
    button.textContent = "🔒";
    button.classList.add("locked");
  } else {
    button.textContent = "🔓";
    button.classList.remove("locked");
  }
}

function lockAll() {
  for (const key in items) {
    locks[key] = true;
    updateLockButton(key);
  }

  showMessage("🔒 全ロックしました");
}

function unlockAll() {
  for (const key in items) {
    locks[key] = false;
    updateLockButton(key);
  }

  showMessage("🔓 全解除しました");
}

function setColor(id, color, name) {
  const element = document.getElementById(id);

  element.style.backgroundColor = color;
  element.innerHTML = name + "<br>" + color;
}

function copyResult() {
  if (!currentResults.gender) {
    alert("まずガチャを回してね！");
    return;
  }

  let text = `【キャラデザガチャ結果】

`;

  const normalKeys = [
    "gender",
    "race",
    "hair",
    "eyes",
    "clothes",
    "personality",
    "attribute",
    "motif"
  ];

  for (const key of normalKeys) {
    if (!removed[key]) {
      text +=
        items[key].label +
        "：" +
        currentResults[key] +
        "\n";
    }
  }

  if (!removed.palette) {
    const palette = currentResults.palette;

    text += `
カラーパレット：${palette[0]}
メインカラー：${palette[1]}
サブカラー：${palette[2]}
アクセントカラー：${palette[3]}`;
  }

  navigator.clipboard
    .writeText(text)
    .then(() => {
      showMessage("✅ コピーしました");
    })
    .catch(() => {
      fallbackCopy(text);
    });
}

function fallbackCopy(text) {
  const textarea = document.createElement("textarea");

  textarea.value = text;
  document.body.appendChild(textarea);
  textarea.select();

  try {
    document.execCommand("copy");
    showMessage("✅ コピーしました");
  } catch {
    alert("コピーに失敗しました。");
  }

  textarea.remove();
}

const HISTORY_KEY = "characterGachaHistoryV4";

function getHistory() {
  const data = localStorage.getItem(HISTORY_KEY);

  if (!data) return [];

  try {
    return JSON.parse(data);
  } catch {
    return [];
  }
}

function saveHistory() {
  if (!currentResults.gender) {
    alert("まずガチャを回してね！");
    return;
  }

  const history = getHistory();

  const entry = {
    id: Date.now(),
    date: new Date().toLocaleString("ja-JP"),

    results: JSON.parse(
      JSON.stringify(currentResults)
    ),

    locks: JSON.parse(
      JSON.stringify(locks)
    ),

    removed: JSON.parse(
      JSON.stringify(removed)
    )
  };

  history.unshift(entry);

  if (history.length > 30) {
    history.length = 30;
  }

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history)
  );

  renderHistory();
  showMessage("🕘 履歴に保存しました");
}

function renderHistory() {
  const history = getHistory();

  const area = document.getElementById("historyList");

  area.innerHTML = "";

  if (history.length === 0) {
    area.innerHTML = `
      <div class="empty-history">
        まだ履歴はありません。
      </div>
    `;

    return;
  }

  history.forEach(entry => {
    const box = document.createElement("div");

    box.className = "history-item";

    const r = entry.results;

    let summary = "";

    if (!entry.removed.gender) {
      summary += "性別：" + r.gender + "<br>";
    }

    if (!entry.removed.race) {
      summary += "種族：" + r.race + "<br>";
    }

    if (!entry.removed.attribute) {
      summary += "属性：" + r.attribute + "<br>";
    }

    if (!entry.removed.motif) {
      summary += "モチーフ：" + r.motif;
    }

    box.innerHTML = `
      <div class="history-time">
        ${entry.date}
      </div>

      <div class="history-summary">
        ${summary}
      </div>

      <div class="history-controls">
        <button
          class="small-button"
          onclick="loadHistory(${entry.id})"
        >
          ↩ 復元
        </button>

        <button
          class="small-button"
          onclick="deleteHistory(${entry.id})"
        >
          🗑 削除
        </button>
      </div>
    `;

    area.appendChild(box);
  });
}

function loadHistory(id) {
  const history = getHistory();

  const entry = history.find(h => h.id === id);

  if (!entry) return;

  for (const key in items) {
    currentResults[key] = entry.results[key];
    locks[key] = entry.locks[key];
    removed[key] = entry.removed[key];

    updateLockButton(key);
    displayItem(key);
  }

  showMessage("↩ 履歴から復元しました");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function deleteHistory(id) {
  let history = getHistory();

  history = history.filter(
    h => h.id !== id
  );

  localStorage.setItem(
    HISTORY_KEY,
    JSON.stringify(history)
  );

  renderHistory();
}

function clearHistory() {
  const history = getHistory();

  if (history.length === 0) return;

  const ok = confirm(
    "履歴をすべて削除しますか？"
  );

  if (!ok) return;

  localStorage.removeItem(HISTORY_KEY);

  renderHistory();
  showMessage("🗑 履歴を削除しました");
}

function toggleHistory() {
  document
    .getElementById("historySection")
    .classList.toggle("open");
}

function showMessage(text) {
  const area =
    document.getElementById(
      "statusMessage"
    );

  area.textContent = text;

  setTimeout(() => {
    if (area.textContent === text) {
      area.textContent = "";
    }
  }, 2500);
}

createResults();
gachaAll();
renderHistory();

</script>
